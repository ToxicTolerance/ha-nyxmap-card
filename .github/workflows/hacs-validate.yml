name: HACS Validate

permissions:
  contents: read

# Release-time validation lives in release.yml, as a job that waits for the
# release to exist: HACS looks for the plugin file in the latest release's
# assets, so validating on the tag push races the asset upload. What is left
# here is the standing check against the default branch.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    if: github.repository == 'ToxicTolerance/ha-nyxmap-card'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
